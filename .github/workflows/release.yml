# Builds the desktop apps for Windows, macOS and Linux and attaches them to a GitHub Release.
#
# Start it by pushing a version tag:
#   git tag v3.0.0 && git push origin v3.0.0
# or run it by hand from the Actions tab ("Desktop apps" > Run workflow). A manual run
# only uploads the files as workflow artifacts; a tag also publishes a Release.
name: Desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux, flags: --linux }
          - { os: windows-latest, name: windows, flags: --win }
          - { os: macos-latest, name: mac, flags: --mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds (no paid certificates needed)
      - uses: actions/upload-artifact@v4
        with:
          name: artful-drawing-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Download artful drawing

            | Computer | File |
            |---|---|
            | Windows (installer) | `artful-drawing-windows-setup.exe` |
            | Windows (no install, runs from a USB stick) | `artful-drawing-windows-portable.exe` |
            | Mac with Apple chip (M1 and newer) | `artful-drawing-mac-arm64.dmg` |
            | Mac with Intel chip | `artful-drawing-mac-x64.dmg` |
            | Linux (any distro) | `artful-drawing-linux-x86_64.AppImage` |
            | Ubuntu / Debian | `artful-drawing-linux-amd64.deb` |

            The apps are not code-signed yet, so Windows and macOS ask once before opening them.
            See the README's "Desktop apps" section for the two clicks it takes.
            Or skip the download: https://normansrule.github.io/artful-drawing/
